# Development Docker Compose - Hot Reload Enabled
name: ocms-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: app-dev
    restart: unless-stopped
    ports:
      - "3080:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-crmuser}:${DB_PASSWORD}@db:5432/${DB_NAME:-zalocrm}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount backend source for hot reload
      - ./backend:/app/backend
      # Mount frontend source for hot reload
      - ./frontend:/app/frontend
      # Named volumes for node_modules to avoid host OS conflicts
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - file_storage:/var/lib/ocms/files
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  chatbot:
    build:
      context: ./ChatBot
      dockerfile: Dockerfile
    container_name: chatbot-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${DB_USER:-crmuser}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-zalocrm}
    env_file:
      - ./ChatBot/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ChatBot:/app
      - chatbot_data:/app/vanna_data

  router:
    build:
      context: ./services/router
      dockerfile: Dockerfile
    container_name: router-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./services/router:/app
      - router_node_modules:/app/node_modules
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: database-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-zalocrm}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crmuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    name: zalocrm_pg_data
  backend_node_modules:
  frontend_node_modules:
  router_node_modules:
  file_storage:
    name: zalocrm_file_storage
  chatbot_data:
    name: zalocrm_chatbot_data
  redis_data:
    name: zalocrm_redis_data

